<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lamp Login · Interactive concept by Trace Solutions Global</title>
<meta name="description" content="An interactive sign-in concept: pull the lamp cord to light the room and reveal the form. Designed and built by Trace Solutions Global.">
<meta name="theme-color" content="#0b0806">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one dark room. The lamp stands on the left, its cord is the only control; the sign-in card waits in the dark on the right until the light reaches it. */
:root {
  --night: #0b0806;
  --wall: #15100c;
  --floor: #1a120c;
  --warm: #ffbe73;
  --warm-deep: #e8873a;
  --amber: #f3a54c;
  --ink: #f6ece0;
  --ink-soft: rgba(246, 236, 224, 0.62);
  --ink-faint: rgba(246, 236, 224, 0.38);
  --card: rgba(22, 16, 12, 0.78);
  --line: rgba(246, 236, 224, 0.1);
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lamp-w: clamp(150px, min(17vw, 29vh), 240px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--night); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 8px; }

/* ---------- demo ribbon ---------- */
.ribbon { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.55rem clamp(16px, 3vw, 28px); font-size: 0.78rem; color: var(--ink-faint); background: linear-gradient(rgba(11, 8, 6, 0.85), rgba(11, 8, 6, 0)); }
.ribbon b { color: var(--ink-soft); font-weight: 600; }
.ribbon a { text-decoration: none; color: var(--ink-soft); white-space: nowrap; }
.ribbon a:hover { color: var(--warm); }
.ribbon .short { display: none; }

/* ---------- room ---------- */
.room { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; overflow: clip; isolation: isolate; background: linear-gradient(var(--wall) 0 78%, var(--floor) 78%); }
.room::after { /* floor line */ content: ""; position: absolute; left: 0; right: 0; top: 78%; height: 1px; background: rgba(255, 255, 255, 0.04); z-index: 0; }
.ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.9s ease;
  background:
    radial-gradient(60% 55% at var(--lx, 28%) 30%, rgba(255, 176, 92, 0.22), transparent 70%),
    radial-gradient(40% 18% at var(--lx, 28%) 82%, rgba(255, 170, 90, 0.2), transparent 70%); }
.brand { position: absolute; z-index: 5; top: 2.6rem; left: clamp(16px, 3vw, 28px); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.32em; color: var(--ink-faint); transition: color 0.8s; }
.brand span { color: var(--amber); }

.stage { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; min-height: 100vh; min-height: 100svh; padding: 4.5rem clamp(16px, 5vw, 64px) 5vh; gap: 2rem; }

/* ---------- lamp ---------- */
.lamp-col { position: relative; display: flex; justify-content: center; align-self: end; }
.lamp { position: relative; width: var(--lamp-w); }
.lamp svg { display: block; width: 100%; height: auto; overflow: visible; }
.cone { position: absolute; z-index: -1; left: 50%; top: 26.8%; width: 620%; height: 130vh; transform: translateX(-50%); pointer-events: none; opacity: 0;
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  background: linear-gradient(rgba(255, 196, 120, 0.42), rgba(255, 170, 90, 0.12) 45%, rgba(255, 150, 70, 0) 80%);
  filter: blur(14px); transition: opacity 0.7s ease; }
.pool { position: absolute; z-index: -1; left: 50%; bottom: -2%; width: 520%; height: 22%; transform: translateX(-50%); border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, rgba(255, 180, 100, 0.35), rgba(255, 160, 80, 0) 100%); transition: opacity 0.9s ease; }
.shade { fill: url(#shadeOff); transition: opacity 0.4s; }
.shade-on, .bulb-on, .bulb-halo { opacity: 0; transition: opacity 0.5s ease; }
.cord { fill: none; stroke: #b8a58c; stroke-width: 1.6; stroke-linecap: round; }
.bead { fill: #d8b98f; }
.handle { fill: transparent; cursor: grab; touch-action: none; }
.handle:active { cursor: grabbing; }
.hint { position: absolute; left: calc(50% + var(--lamp-w) * 0.34); top: calc(var(--lamp-w) * 1.22); white-space: nowrap; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-faint); pointer-events: none; transition: opacity 0.4s; }
.hint::before { content: ""; display: inline-block; width: 1.6rem; height: 1px; margin: 0 0.6rem 0.25rem 0; background: currentColor; vertical-align: middle; }
.pull-btn { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pull-btn:focus-visible { position: absolute; left: calc(50% + var(--lamp-w) * 0.2); top: calc(var(--lamp-w) * 1.32); width: auto; height: auto; clip: auto; padding: 0.4rem 0.8rem; border-radius: 999px; border: 1px solid var(--amber); background: var(--night); font-size: 0.8rem; }

/* light ON */
.room.is-on .ambient, .room.is-on .cone, .room.is-on .pool,
.room.is-on .shade-on, .room.is-on .bulb-on, .room.is-on .bulb-halo { opacity: 1; }
.room.is-on .brand { color: var(--ink-soft); }
.room.flicker .ambient, .room.flicker .cone, .room.flicker .pool, .room.flicker .shade-on, .room.flicker .bulb-on, .room.flicker .bulb-halo { animation: flicker 0.75s steps(1, end); }
@keyframes flicker { 0% { opacity: 0.85; } 12% { opacity: 0.1; } 24% { opacity: 0.9; } 34% { opacity: 0.25; } 46% { opacity: 1; } 100% { opacity: 1; } }
.lamp .swing { transform-origin: 110px 40px; transition: transform 0.15s; }

/* ---------- card ---------- */
.card-col { display: flex; justify-content: center; align-self: center; min-width: 0; }
.card { position: relative; width: min(400px, 100%); padding: 2rem 1.8rem 1.5rem; border-radius: 22px; background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), -30px 0 80px -40px rgba(255, 170, 90, 0.35);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  opacity: 0; transform: translateY(18px) scale(0.98); filter: blur(6px); visibility: hidden;
  transition: opacity 0.7s ease 0.25s, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s, filter 0.7s ease 0.25s, visibility 0s linear 0.95s; }
.room.is-on .card { opacity: 1; transform: none; filter: none; visibility: visible; transition-delay: 0.25s, 0.25s, 0.25s, 0s; }
.card::before { /* warm edge where the lamp light hits */ content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(110deg, rgba(255, 190, 115, 0.45), rgba(255, 190, 115, 0) 45%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.eyebrow { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--amber); }
.card h1 { margin: 0.7rem 0 1.4rem; font: 400 2.5rem/1.02 var(--serif); letter-spacing: -0.01em; }
.card h1 em { display: block; color: #cfa874; }
.field { display: grid; gap: 0.4rem; margin-bottom: 0.95rem; }
.field label { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); }
.field > * { min-width: 0; }
.input { width: 100%; min-width: 0; display: flex; align-items: center; gap: 0.6rem; height: 48px; padding: 0 0.9rem; border-radius: 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); transition: border-color 0.2s, box-shadow 0.2s; }
.input:focus-within { border-color: rgba(243, 165, 76, 0.7); box-shadow: 0 0 0 4px rgba(243, 165, 76, 0.14); }
.input svg { width: 16px; height: 16px; flex: none; color: var(--ink-faint); }
.input input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 0.95rem; }
.input input::placeholder { color: var(--ink-faint); }
.input.is-bad { border-color: #e0664a; }
.show { border: 0; background: none; padding: 0.3rem 0.1rem; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.18em; color: var(--ink-faint); cursor: pointer; }
.show:hover { color: var(--ink); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 0.2rem 0 1.2rem; font-size: 0.84rem; color: var(--ink-soft); }
.check { display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--amber); }
.link { background: none; border: 0; padding: 0; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 0.84rem; }
.link:hover { color: var(--ink); }
.primary { width: 100%; height: 50px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 700; color: #2a1606;
  background: linear-gradient(180deg, #ffc27a, #e98d3c); box-shadow: 0 10px 30px -10px rgba(233, 141, 60, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.4); transition: transform 0.15s, filter 0.2s; }
.primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.primary:disabled { cursor: progress; filter: saturate(0.6); }
.or { display: flex; align-items: center; gap: 0.8rem; margin: 1.1rem 0; font-size: 0.72rem; color: var(--ink-faint); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.alt { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.alt button { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: background 0.2s; }
.alt button:hover { background: rgba(255, 255, 255, 0.07); }
.alt svg { width: 16px; height: 16px; }
.foot { margin-top: 1.2rem; font-size: 0.86rem; color: var(--ink-soft); }
.note { margin-top: 0.8rem; font-size: 0.74rem; color: var(--ink-faint); }
.status { margin-top: 0.9rem; padding: 0.7rem 0.85rem; border-radius: 10px; font-size: 0.86rem; background: rgba(243, 165, 76, 0.12); color: #ffd7a6; }
.status.is-bad { background: rgba(224, 102, 74, 0.14); color: #ffb3a1; }
.welcome { text-align: center; padding: 1rem 0 0.4rem; }
.welcome .tick { width: 54px; height: 54px; margin: 0 auto 1rem; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #ffc27a, #e98d3c); color: #2a1606; font-size: 1.5rem; font-weight: 800; }
.welcome h2 { margin: 0; font: 400 2.1rem/1.1 var(--serif); }
.welcome p { color: var(--ink-soft); margin: 0.6rem 0 1.2rem; }

/* ---------- dust ---------- */
#dust { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 1s; }
.room.is-on #dust { opacity: 1; }

/* ---------- phones: lamp on top, card below ---------- */
@media (max-width: 820px) {
  :root { --lamp-w: clamp(104px, 28vw, 150px); }
  .room { background: var(--wall); }
  .room::after { display: none; }
  .ribbon .long { display: none; }
  .ribbon .short { display: inline; }
  .brand { top: 2.4rem; }
  .stage { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 1.2rem; padding-top: 4.8rem; padding-bottom: 2.5rem; }
  .lamp-col { align-self: start; justify-content: flex-start; padding-left: 12%; }
  .hint { font-size: 0.6rem; letter-spacing: 0.18em; }
  .card { padding: 1.6rem 1.25rem 1.3rem; }
  .card h1 { font-size: 2.1rem; }
  .room:not(.is-on) .card-col { display: none; }
  .ambient { background: radial-gradient(90% 40% at var(--lx, 30%) 18%, rgba(255, 176, 92, 0.24), transparent 70%); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
  #dust { display: none; }
}
</style>
</head>
<body>
<div class="ribbon"><span><span class="long">Interactive concept</span><span class="short">Concept</span> by <b>Trace Solutions Global</b></span><a href="../../work.html">← Back to our work</a></div>

<main class="room" id="room">
  <div class="ambient" aria-hidden="true"></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="brand" aria-hidden="true">NIGHT<span>DESK</span> STUDIO</div>

  <div class="stage">
    <div class="lamp-col">
      <div class="lamp" id="lamp">
        <div class="cone" aria-hidden="true"></div>
        <div class="pool" aria-hidden="true"></div>
        <svg viewBox="0 0 220 560" aria-hidden="true">
          <defs>
            <linearGradient id="shadeOff" x1="0" x2="1">
              <stop offset="0" stop-color="#1c1712"/><stop offset=".55" stop-color="#2a221b"/><stop offset="1" stop-color="#14100c"/>
            </linearGradient>
            <linearGradient id="shadeOnG" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#f6c98c"/><stop offset="1" stop-color="#ffdca8"/>
            </linearGradient>
            <linearGradient id="shadeSide" x1="0" x2="1">
              <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
            </linearGradient>
            <radialGradient id="halo"><stop offset="0" stop-color="#ffd59a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
            <linearGradient id="pole" x1="0" x2="1">
              <stop offset="0" stop-color="#0f0c0a"/><stop offset=".5" stop-color="#3a3029"/><stop offset="1" stop-color="#0f0c0a"/>
            </linearGradient>
            <linearGradient id="brass" x1="0" x2="1">
              <stop offset="0" stop-color="#6b4f22"/><stop offset=".5" stop-color="#c79a4f"/><stop offset="1" stop-color="#5a421c"/>
            </linearGradient>
          </defs>
          <g class="swing" id="swing">
            <circle class="bulb-halo" cx="110" cy="160" r="70" fill="url(#halo)"/>
            <ellipse class="bulb-on" cx="110" cy="160" rx="15" ry="17" fill="#fff1d6"/>
            <ellipse cx="110" cy="160" rx="13" ry="15" fill="#3a3129" opacity=".9" class="bulb-off"/>
            <path class="shade" d="M60 40 H160 L205 148 H15 Z"/>
            <path class="shade-on" d="M60 40 H160 L205 148 H15 Z" fill="url(#shadeOnG)"/>
            <path d="M60 40 H160 L205 148 H15 Z" fill="url(#shadeSide)"/>
            <path d="M15 148 H205" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
            <rect x="104" y="148" width="12" height="10" fill="#2b241e"/>
          </g>
          <rect x="105" y="178" width="10" height="340" fill="url(#pole)"/>
          <rect x="101" y="372" width="18" height="16" rx="3" fill="url(#brass)"/>
          <rect x="102" y="176" width="16" height="8" rx="2" fill="url(#brass)"/>
          <ellipse cx="110" cy="540" rx="62" ry="12" fill="#000" opacity=".45"/>
          <path d="M58 532 Q58 516 110 514 Q162 516 162 532 Q162 544 110 545 Q58 544 58 532 Z" fill="#17120e"/>
          <path d="M60 528 Q70 518 110 517 Q150 518 160 528" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
          <path class="cord" id="cord" d="M150 148 Q152 200 154 250"/>
          <circle class="bead" id="bead" cx="154" cy="250" r="5"/>
          <circle class="handle" id="handle" cx="154" cy="250" r="24"/>
        </svg>
        <span class="hint" id="hint">Pull the cord</span>
        <button type="button" class="pull-btn" id="pullBtn" aria-pressed="false">Pull the lamp cord to turn the light on</button>
      </div>
    </div>

    <div class="card-col">
      <section class="card" id="card" aria-labelledby="cardTitle" inert>
        <div id="cardBody">
          <div class="eyebrow">Studio access</div>
          <h1 id="cardTitle">Welcome back.<em>Pull up a chair.</em></h1>
          <form id="form" novalidate autocomplete="off">
            <div class="field">
              <label for="email">Email</label>
              <div class="input" id="emailBox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                <input id="email" type="email" inputmode="email" placeholder="you@studio.com" autocomplete="off" spellcheck="false">
              </div>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input" id="passBox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="show" id="showPass" aria-pressed="false" aria-label="Show password">SHOW</button>
              </div>
            </div>
            <div class="row">
              <label class="check"><input type="checkbox" checked> Keep me signed in</label>
              <button type="button" class="link" data-demo="Password resets are switched off in this demo.">Forgot password</button>
            </div>
            <button class="primary" type="submit" id="signIn">Sign in</button>
            <div class="or">or</div>
            <div class="alt">
              <button type="button" data-demo="Passkeys are switched off in this demo."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg>Passkey</button>
              <button type="button" data-demo="Magic links are switched off in this demo."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 14 10M15 4v3M18 7h3M19 10l2 2M12 3l1 1"/></svg>Email link</button>
            </div>
            <p class="foot">No account? <button type="button" class="link" data-demo="Sign-ups are switched off in this demo.">Request one</button></p>
            <p class="note">Demo build: nothing you type is sent or stored.</p>
            <p class="status" id="status" role="status" hidden></p>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const room = $("#room"), card = $("#card"), hint = $("#hint"), pullBtn = $("#pullBtn");
  const svg = document.querySelector(".lamp svg"), cord = $("#cord"), bead = $("#bead"), handle = $("#handle"), swing = $("#swing");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- light switch ---------- */
  let on = false;
  function setLight(next) {
    on = next;
    room.classList.toggle("is-on", on);
    room.classList.remove("flicker");
    if (on && !reduce) { void room.offsetWidth; room.classList.add("flicker"); }
    card.inert = !on;
    pullBtn.setAttribute("aria-pressed", String(on));
    pullBtn.textContent = on ? "Pull the lamp cord to turn the light off" : "Pull the lamp cord to turn the light on";
    hint.textContent = on ? "Pull again for dark" : "Pull the cord";
  }

  /* ---------- pull cord: a little spring on the end of a string ---------- */
  const A = { x: 150, y: 148 };          // where the cord leaves the shade
  const REST = { x: 154, y: 250 };       // where the bead hangs
  const LEN = Math.hypot(REST.x - A.x, REST.y - A.y);
  const MAX = LEN * 1.45, TRIGGER = LEN + 34;
  let p = { ...REST }, v = { x: 0, y: 0 }, dragging = false, armed = false, moved = 0, raf = 0, start = null;

  function draw() {
    const dx = p.x - A.x, dy = p.y - A.y, d = Math.hypot(dx, dy);
    const slack = Math.max(0, LEN - d) * 0.7;
    const cx = (A.x + p.x) / 2 - dy * 0.04, cy = (A.y + p.y) / 2 + slack;
    cord.setAttribute("d", `M${A.x} ${A.y} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
    bead.setAttribute("cx", p.x); bead.setAttribute("cy", p.y);
    handle.setAttribute("cx", p.x); handle.setAttribute("cy", p.y);
    const tug = Math.max(0, d - LEN) / (MAX - LEN);
    swing.style.transform = `rotate(${(dx - 4) * 0.02}deg) translateY(${tug * 3}px)`;
  }
  function settle() {
    cancelAnimationFrame(raf);
    if (reduce) { p = { ...REST }; v = { x: 0, y: 0 }; draw(); return; }
    const step = () => {
      v.x = (v.x + (REST.x - p.x) * 0.09) * 0.86;
      v.y = (v.y + (REST.y - p.y) * 0.09) * 0.86;
      p.x += v.x; p.y += v.y;
      draw();
      if (Math.abs(v.x) + Math.abs(v.y) + Math.abs(REST.x - p.x) + Math.abs(REST.y - p.y) > 0.05) raf = requestAnimationFrame(step);
      else { p = { ...REST }; draw(); }
    };
    raf = requestAnimationFrame(step);
  }
  function toSvg(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  handle.addEventListener("pointerdown", e => {
    e.preventDefault();
    dragging = true; armed = false; moved = 0; start = toSvg(e);
    handle.setPointerCapture(e.pointerId);
    cancelAnimationFrame(raf);
  });
  handle.addEventListener("pointermove", e => {
    if (!dragging) return;
    const q = toSvg(e);
    moved = Math.max(moved, Math.hypot(q.x - start.x, q.y - start.y));
    let dx = q.x - A.x, dy = Math.max(q.y - A.y, 20), d = Math.hypot(dx, dy);
    if (d > MAX) { dx *= MAX / d; dy *= MAX / d; d = MAX; }
    p = { x: A.x + dx, y: A.y + dy };
    if (d > TRIGGER) armed = true;
    draw();
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    if (armed || moved < 4) setLight(!on);   // a real tug, or a simple tap on the bead
    settle();
  };
  handle.addEventListener("pointerup", release);
  handle.addEventListener("pointercancel", () => { dragging = false; settle(); });

  /* Keyboard and screen readers: the same tug, played as an animation. */
  pullBtn.addEventListener("click", () => {
    if (reduce) { setLight(!on); return; }
    cancelAnimationFrame(raf);
    const t0 = performance.now();
    const down = now => {
      const k = Math.min(1, (now - t0) / 180);
      p = { x: REST.x + 2 * k, y: REST.y + (TRIGGER - LEN + 12) * k }; draw();
      if (k < 1) raf = requestAnimationFrame(down); else { setLight(!on); settle(); }
    };
    raf = requestAnimationFrame(down);
  });
  draw();

  /* Keep the room's warm glow centred on the lamp. */
  function placeGlow() {
    const r = $("#lamp").getBoundingClientRect(), rr = room.getBoundingClientRect();
    room.style.setProperty("--lx", ((r.left + r.width / 2 - rr.left) / rr.width * 100).toFixed(1) + "%");
  }
  addEventListener("resize", placeGlow); placeGlow();

  /* ---------- dust drifting through the light ---------- */
  const cv = $("#dust"), ctx = cv.getContext("2d"), cone = document.querySelector(".cone");
  let motes = [];
  function sizeDust() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = room.clientWidth * dpr; cv.height = room.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = Array.from({ length: Math.round(Math.min(90, room.clientWidth / 12)) }, () => ({
      x: Math.random() * room.clientWidth, y: Math.random() * room.clientHeight,
      r: Math.random() * 1.4 + 0.3, vx: (Math.random() - 0.5) * 0.12, vy: -Math.random() * 0.15 - 0.03, ph: Math.random() * 6.3
    }));
  }
  function inCone(x, y) {
    const c = cone.getBoundingClientRect(), rr = room.getBoundingClientRect();
    const top = c.top - rr.top, h = c.height, l = c.left - rr.left, w = c.width;
    if (y < top || y > top + h) return 0;
    const t = (y - top) / h;
    const left = l + w * 0.42 * (1 - t), right = l + w * (0.58 + 0.42 * t);
    if (x < left || x > right) return 0;
    return 1 - t * 0.85;
  }
  function dust(now) {
    requestAnimationFrame(dust);
    if (!on || document.hidden) return;
    ctx.clearRect(0, 0, room.clientWidth, room.clientHeight);
    for (const m of motes) {
      m.x += m.vx + Math.sin(now / 1800 + m.ph) * 0.05; m.y += m.vy;
      if (m.y < 0) { m.y = room.clientHeight; m.x = Math.random() * room.clientWidth; }
      const a = inCone(m.x, m.y);
      if (!a) continue;
      ctx.globalAlpha = a * (0.35 + 0.35 * Math.sin(now / 900 + m.ph));
      ctx.fillStyle = "#ffe2b8";
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }
  }
  if (!reduce) { addEventListener("resize", sizeDust); sizeDust(); requestAnimationFrame(dust); }

  /* ---------- the form: a demo that never sends anything ---------- */
  const form = $("#form"), status = $("#status");
  const say = (msg, bad) => { status.hidden = false; status.textContent = msg; status.classList.toggle("is-bad", !!bad); };
  $("#showPass").addEventListener("click", e => {
    const i = $("#password"), show = i.type === "password";
    i.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "HIDE" : "SHOW";
    e.currentTarget.setAttribute("aria-pressed", String(show));
    e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });
  document.querySelectorAll("[data-demo]").forEach(b => b.addEventListener("click", () => say(b.dataset.demo)));
  form.addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#email").value.trim(), pass = $("#password").value;
    const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    $("#emailBox").classList.toggle("is-bad", !okEmail);
    $("#passBox").classList.toggle("is-bad", !pass);
    if (!okEmail || !pass) return say(!okEmail ? "Add an email address to continue." : "Add a password to continue.", true);
    const btn = $("#signIn"); btn.disabled = true; btn.textContent = "Signing in…";
    setTimeout(() => {
      form.reset();
      $("#cardBody").innerHTML = `<div class="welcome"><div class="tick" aria-hidden="true">✓</div>
        <h2>You're in.</h2><p>This is a demo, so nothing was sent or stored.</p>
        <button type="button" class="primary" id="again">Try it again</button></div>`;
      $("#again").addEventListener("click", () => location.reload());
    }, 900);
  });
})();
</script>
</body>
</html>
