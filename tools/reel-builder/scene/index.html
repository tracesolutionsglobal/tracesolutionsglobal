<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trace reel scene</title>
<style>
  @font-face { font-family: Poppins; font-weight: 600; src: url(/node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(/node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(/node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2) format('woff2'); }
  :root { --accent: #3291FF; --accent2: #3FBE63; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #071628; }
  body { font-family: Poppins, sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; transform-origin: 50% 40%; }
  #bg { position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 50% 40%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      linear-gradient(180deg, #0a1f3a 0%, #071628 45%, #040d1a 100%); }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  /* Text layer: not zoomed, so it stays inside the safe area (120px top, 250px bottom). */
  #text { position: absolute; inset: 0; }
  .beat { position: absolute; left: 0; right: 0; top: 0; bottom: 0; opacity: 0; }
  .headline { position: absolute; top: 150px; left: 70px; right: 70px; text-align: center;
    font-weight: 800; font-size: 74px; line-height: 1.12; letter-spacing: .5px; text-transform: uppercase;
    text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .divider { position: absolute; top: 1196px; left: 110px; right: 110px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 15%, var(--accent) 85%, transparent);
    box-shadow: 0 0 18px var(--accent); }
  .body { position: absolute; top: 1250px; left: 80px; right: 80px; text-align: center;
    font-weight: 800; font-size: 54px; line-height: 1.22; text-transform: uppercase; }
  .body .a { color: var(--accent); display: block; margin-top: 6px; }
  .body .w { display: block; }
  .bigbadge { display: inline-block; background: #fff; border-radius: 34px; padding: 34px 46px;
    box-shadow: 0 18px 60px rgba(0,0,0,.45), 0 0 0 4px color-mix(in srgb, var(--accent) 55%, transparent); }
  .bigbadge img { display: block; width: 780px; height: auto; }
  .url { display: inline-block; margin-top: 22px; padding: 14px 34px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 46px; font-weight: 800; text-transform: lowercase;
    box-shadow: 0 10px 40px color-mix(in srgb, var(--accent) 50%, transparent); }
  #badge { position: absolute; left: 50%; top: 1550px; transform: translateX(-50%);
    background: #fff; border-radius: 22px; padding: 18px 28px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #badge img { display: block; width: 440px; height: auto; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas></div>
<div id="text"></div>
<div id="badge"><img src="/logo/wordmark.jpg" alt=""></div>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module" src="scene.js"></script>
</body>
</html>
