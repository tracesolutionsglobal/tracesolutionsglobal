/* =========================================================
   Trace Solutions Global: brand tokens
   Every colour, font and spacing value lives here.
   Change the brand in this one file.
   Layout concept: a calm off-white studio page where a
   navy browser window "traces" each client's site to life.
   ========================================================= */
:root {
  /* Brand colours (sampled from the poster) */
  --navy: #012228;          /* logo ink: headings, main text, browser bar */
  --navy-2: #0B3A40;        /* hover / raised navy */
  --ink-soft: #4A5D60;      /* secondary text */
  --green: #158A49;         /* text-safe brand green: links, highlights */
  --green-deep: #0C5A31;    /* logo shadow, pressed states */
  --green-bright: #2DBE6C;  /* small accents on navy */
  --mint: #CDEFD9;          /* soft shapes, section tints */
  --mint-soft: #EAF7EF;     /* lightest tint */
  --logo-green: #1FA75A;   /* exact green from the logo */
  --coral: #FB7250;         /* brand coral: underline, dots, loop */
  --coral-btn: #E4572E;     /* coral for buttons (better text contrast) */
  --coral-soft: #FFE6DD;
  --paper: #FCFBF6;         /* page background */
  --white: #FFFFFF;
  --line: #E4E7E1;          /* hairlines on paper */
  --line-navy: rgba(255, 255, 255, 0.12);

  /* Type */
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-logo: "Montserrat", "Plus Jakarta Sans", "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-serif: "DM Serif Display", Georgia, "Times New Roman", serif; /* used by "Elegant" previews */

  /* Type scale */
  --t-xs: 0.78rem;
  --t-sm: 0.9rem;
  --t-md: 1.05rem;
  --t-lg: 1.25rem;
  --t-xl: clamp(1.6rem, 3vw, 2.1rem);
  --t-2xl: clamp(2.1rem, 4.4vw, 3.2rem);
  --t-hero: clamp(2.5rem, 5.2vw, 4.4rem);

  /* Spacing & shape */
  --gutter: clamp(16px, 4vw, 48px);
  --max: 1200px;
  --section: clamp(4.5rem, 9vw, 7.5rem);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(1, 34, 40, 0.06), 0 2px 8px rgba(1, 34, 40, 0.05);
  --shadow-md: 0 10px 30px -10px rgba(1, 34, 40, 0.22);
  --shadow-lg: 0 30px 70px -24px rgba(1, 34, 40, 0.35);

  /* Motion */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  color-scheme: light;
}

</style>
<style>
/* =========================================================
   Base: reset, typography, layout primitives
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--navy);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; }
h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0;
  text-wrap: balance;
}
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--mint); color: var(--navy); }

.container { max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: var(--section); position: relative; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 0.6rem;
  font-family: var(--f-mono); font-size: var(--t-xs); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--green);
}
.eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--coral); border-radius: 2px; }

.h2 { font-size: var(--t-2xl); margin-top: 0.9rem; }
.lede { font-size: var(--t-lg); line-height: 1.55; color: var(--ink-soft); max-width: 56ch; margin-top: 1.1rem; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1.5rem 3rem; }
.section-head .lede { max-width: 44ch; }

[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  html { scroll-behavior: auto; }
}

</style>
<style>
/* =========================================================
   Components: shared across every page
   ========================================================= */

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--navy); min-width: 0; flex-shrink: 0; }
.logo svg.mark { width: 34px; height: 26px; flex: none; color: var(--navy); }
.logo .word { font-family: var(--f-logo); font-weight: 600; font-size: 0.98rem; letter-spacing: 0.12em; line-height: 1; white-space: nowrap; color: var(--navy); }
.logo .word .g { color: var(--logo-green); }
.logo--light, .logo--light .word, .logo--light svg.mark { color: var(--white); }
.logo--light .word .g { color: var(--green-bright); }
@media (max-width: 400px) { .logo .word { font-size: 0.82rem; letter-spacing: 0.08em; } .logo svg.mark { width: 30px; height: 23px; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
  padding: 0.95rem 1.5rem; border-radius: var(--r-pill); border: 0; cursor: pointer;
  font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; line-height: 1.1;
  text-decoration: none; white-space: nowrap;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.2s, color 0.2s;
}
.btn .arrow { transition: transform 0.25s var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }
.btn--coral { background: var(--coral-btn); color: var(--white); box-shadow: 0 8px 22px -8px rgba(228, 87, 46, 0.65); }
.btn--coral:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(228, 87, 46, 0.7); }
.btn--navy { background: var(--navy); color: var(--white); }
.btn--navy:hover { background: var(--navy-2); transform: translateY(-2px); }
.btn--outline { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
.btn--outline:hover { background: var(--navy); color: var(--white); }
.btn--ghost-light { background: transparent; color: var(--white); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35); }
.btn--ghost-light:hover { box-shadow: inset 0 0 0 2px var(--white); }
.btn--sm { padding: 0.7rem 1.1rem; font-size: 0.95rem; }

.link-arrow { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; color: var(--green); text-decoration: none; }
.link-arrow:hover { color: var(--green-deep); }
.link-arrow:hover span { transform: translateX(3px); }
.link-arrow span { transition: transform 0.2s var(--ease); }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: rgba(252, 251, 246, 0.86);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent; transition: border-color 0.3s;
}
.site-header.is-scrolled { border-bottom-color: var(--line); }
.site-header .container { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; padding-block: 0.9rem; }
.nav-links { display: flex; align-items: center; gap: 1.7rem; white-space: nowrap; list-style: none; margin: 0; padding: 0; font-weight: 600; font-size: 0.97rem; }
.nav-links a { text-decoration: none; color: var(--navy); position: relative; padding-block: 0.3rem; }
.nav-links a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -2px; height: 2px; background: var(--coral); border-radius: 2px; transition: right 0.3s var(--ease); }
.nav-links a:hover::after { right: 0; }
.nav-actions { display: flex; align-items: center; gap: 0.6rem; }
.menu-toggle { display: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--mint-soft); cursor: pointer; place-items: center; }
.menu-toggle span, .menu-toggle span::before, .menu-toggle span::after { display: block; width: 18px; height: 2px; background: var(--navy); border-radius: 2px; position: relative; transition: transform 0.3s var(--ease); }
.menu-toggle span::before, .menu-toggle span::after { content: ""; position: absolute; left: 0; }
.menu-toggle span::before { top: -6px; }
.menu-toggle span::after { top: 6px; }
.menu-open .menu-toggle span { background: transparent; }
.menu-open .menu-toggle span::before { transform: translateY(6px) rotate(45deg); }
.menu-open .menu-toggle span::after { transform: translateY(-6px) rotate(-45deg); }

@media (max-width: 1240px) {
  .menu-toggle { display: grid; }
  .nav-actions .btn { display: none; }
  .nav-links {
    position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--line); padding: 0.5rem var(--gutter) 1.2rem;
    display: none;
  }
  .menu-open .nav-links { display: flex; }
  .nav-links a { display: block; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
  .nav-links a::after { display: none; }
  .nav-links .mobile-cta { display: block; margin-top: 1rem; }
  .nav-links .mobile-cta .btn { width: 100%; }
}
@media (min-width: 1241px) { .nav-links .mobile-cta { display: none; } }

/* ---------- Browser frame (used by hero, teaser, portfolio) ---------- */
.browser { background: var(--white); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-lg); position: relative; }
.browser-bar { display: flex; align-items: center; gap: 0.9rem; background: var(--navy); padding: 0.65rem 0.9rem; }
.browser-dots { display: flex; gap: 6px; flex: none; }
.browser-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
.browser-dots i:nth-child(2) { background: var(--green-bright); }
.browser-dots i:nth-child(3) { background: var(--white); }
.browser-url {
  flex: 1; min-width: 0; background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.85);
  border-radius: var(--r-pill); padding: 0.28rem 0.8rem; font-family: var(--f-mono); font-size: 0.72rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.browser-url .lock { color: rgba(255, 255, 255, 0.45); }
.browser-body { position: relative; container-type: inline-size; }
.browser--sm .browser-bar { padding: 0.45rem 0.7rem; }
.browser--sm .browser-dots i { width: 7px; height: 7px; }
.browser--sm .browser-url { font-size: 0.62rem; padding: 0.18rem 0.6rem; }

/* ---------- Chips & segmented controls ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.55rem 0.95rem; border-radius: var(--r-pill);
  border: 1.5px solid var(--line); background: var(--white); cursor: pointer; font-weight: 600; font-size: 0.92rem;
  transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.2s var(--ease);
}
.chip:hover { border-color: var(--green); transform: translateY(-1px); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
.chip svg { width: 16px; height: 16px; flex: none; }

.tag { display: inline-block; font-size: var(--t-xs); font-weight: 700; padding: 0.22rem 0.65rem; border-radius: var(--r-pill); background: var(--mint-soft); color: var(--green-deep); }
.tag--coral { background: var(--coral-soft); color: #B23E1B; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.field label { font-weight: 700; font-size: 0.88rem; }
.field input, .field select, .field textarea {
  width: 100%; padding: 0.85rem 1rem; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--white);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input::placeholder, .field textarea::placeholder { color: #9AA6B2; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(13, 139, 118, 0.15); }
.field textarea { min-height: 120px; resize: vertical; }
.field .err { color: #B3261E; font-size: 0.82rem; font-weight: 600; }
.field.has-error input, .field.has-error textarea { border-color: #B3261E; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; } /* spam honeypot */

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 100;
  transform: translate(-50%, 160%); max-width: calc(100% - 32px);
  background: var(--navy); color: var(--white); padding: 0.85rem 1.3rem; border-radius: var(--r-pill);
  font-weight: 600; font-size: 0.95rem; box-shadow: var(--shadow-lg); text-align: center;
  visibility: hidden; transition: transform 0.4s var(--ease), visibility 0s linear 0.4s;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform 0.4s var(--ease); }

/* ---------- Footer ---------- */
.site-footer { background: var(--navy); color: rgba(255, 255, 255, 0.78); padding-block: 4rem 2rem; }
.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 2.5rem; }
@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; } .footer-brand { grid-column: 1 / -1; } }
@media (max-width: 480px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-brand p { margin-top: 1rem; max-width: 34ch; font-size: 0.95rem; }
.footer-brand .tagline { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-bright); margin-top: 1.2rem; }
.site-footer h4 { color: var(--white); font-size: 0.95rem; letter-spacing: 0; font-weight: 700; margin-bottom: 1rem; }
.site-footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; font-size: 0.95rem; }
.site-footer a { text-decoration: none; }
.site-footer a:hover { color: var(--white); }
.footer-bottom { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line-navy); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; font-size: 0.85rem; }
.legal-line { margin: 0.8rem 0 0; font-size: 0.82rem; color: rgba(255,255,255,.62); }
.legal-line a, .privacy a { color: inherit; text-underline-offset: 2px; }

</style>
<style>
/* =========================================================
   Live website preview ("mini site") renderer styles
   Used by: hero, concept teaser, portfolio thumbnails,
   and later the full Concept Builder.
   Sizes are in em, and the base size follows the browser
   frame width (container query units), so one preview
   scales from a small card to a large hero.
   ========================================================= */
.pv {
  --pv-radius: 0.9em;
  --pv-head: var(--f-display);
  --pv-head-weight: 800;
  font-size: clamp(3.6px, 1.42cqw, 11px);
  font-family: var(--f-body);
  background: var(--pv-bg);
  color: var(--pv-ink);
  padding: 2.2em 2.4em 2.6em;
  display: grid;
  gap: 1.9em;
  line-height: 1.35;
  transition: background 0.5s var(--ease), color 0.5s var(--ease);
}
.pv--bold { --pv-radius: 0.25em; --pv-head-weight: 800; }
.pv--elegant { --pv-radius: 0.35em; --pv-head: var(--f-serif); --pv-head-weight: 400; }

.pv h4, .pv .pv-name { font-family: var(--pv-head); font-weight: var(--pv-head-weight); }

/* nav */
.pv-nav { display: flex; align-items: center; justify-content: space-between; gap: 1.5em; }
.pv-logo { display: inline-flex; align-items: center; gap: 0.6em; font-size: 1.3em; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.pv-logo i { width: 1.25em; height: 1.25em; border-radius: 50%; background: var(--pv-primary); box-shadow: 0.45em -0.25em 0 -0.25em var(--pv-accent); }
.pv--elegant .pv-logo { font-weight: 400; }
.pv--elegant .pv-logo i { border-radius: 0.2em; transform: rotate(45deg) scale(0.8); }
.pv-links { display: flex; gap: 1.9em; font-size: 1.05em; color: var(--pv-muted); white-space: nowrap; }
.pv-links b { font-weight: 600; }
.pv-links b:first-child { color: var(--pv-ink); }
.pv-cta { background: var(--pv-primary); color: var(--pv-on-primary); padding: 0.65em 1.25em; border-radius: 999px; font-weight: 700; font-size: 1em; white-space: nowrap; }
.pv--bold .pv-cta, .pv--bold .pv-btn { border-radius: var(--pv-radius); text-transform: uppercase; letter-spacing: 0.06em; }
.pv--elegant .pv-cta, .pv--elegant .pv-btn { border-radius: 0; background: transparent; color: var(--pv-ink); box-shadow: inset 0 0 0 0.12em var(--pv-ink); }

/* hero */
.pv-hero { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 2em; align-items: center; background: var(--pv-soft); border-radius: var(--pv-radius); padding: 2.6em 2.6em 2.6em 3em; overflow: hidden; }
.pv-copy small { display: block; font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--pv-accent-text); }
.pv-copy h4 { font-size: 3.1em; line-height: 1.04; letter-spacing: -0.03em; margin: 0.35em 0 0.45em; color: var(--pv-ink); text-wrap: balance; }
.pv--bold .pv-copy h4 { text-transform: uppercase; font-size: 3.3em; letter-spacing: -0.02em; line-height: 0.98; }
.pv--elegant .pv-copy h4 { letter-spacing: -0.01em; font-size: 3.3em; }
.pv-copy p { font-size: 1.15em; color: var(--pv-muted); max-width: 30ch; }
.pv-btn { display: inline-flex; margin-top: 1.5em; background: var(--pv-primary); color: var(--pv-on-primary); padding: 0.85em 1.5em; border-radius: 999px; font-weight: 700; font-size: 1.05em; }
.pv-art svg { display: block; width: 100%; height: auto; border-radius: calc(var(--pv-radius) * 0.8); }

/* cards */
.pv-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4em; }
.pv-card { background: var(--pv-surface); border-radius: var(--pv-radius); padding: 1.5em; display: grid; gap: 0.7em; box-shadow: 0 0 0 0.1em var(--pv-line); }
.pv-ic { width: 3.3em; height: 3.3em; border-radius: 50%; background: var(--pv-soft); color: var(--pv-primary-text); display: grid; place-items: center; }
.pv--bold .pv-ic { border-radius: var(--pv-radius); }
.pv-ic svg { width: 1.7em; height: 1.7em; }
.pv-card b { font-size: 1.2em; font-weight: 700; }
.pv-card i, .pv-strip i { display: block; height: 0.55em; border-radius: 1em; background: var(--pv-line); }
.pv-card i:last-child { width: 62%; }

/* proof strip */
.pv-strip { display: flex; align-items: center; gap: 1.3em; background: var(--pv-surface); border-radius: var(--pv-radius); padding: 1.3em 1.5em; box-shadow: 0 0 0 0.1em var(--pv-line); }
.pv-check { width: 2.8em; height: 2.8em; flex: none; border-radius: 50%; background: var(--pv-primary); color: var(--pv-on-primary); display: grid; place-items: center; font-weight: 800; font-size: 1.05em; }
.pv-strip b { font-size: 1.15em; white-space: nowrap; }
.pv-strip .bars { flex: 1; display: grid; gap: 0.5em; }
.pv-strip .bars i:last-child { width: 55%; }

/* ---------- Trace animation ----------
   JS measures each [data-t] block, draws an SVG outline over it,
   then the block fills in. */
.trace-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.trace-layer rect {
  fill: none; stroke: var(--coral); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: trace-draw 0.75s var(--ease) forwards, trace-fade 0.5s ease forwards;
  animation-delay: var(--d, 0s), calc(var(--d, 0s) + 1.2s);
}

<script>
/* =========================================================
   Preview engine: renders a convincing mini website from a
   business config + options, and "traces" it in.

   TS.renderPreview(bodyEl, config, {
     style:    "fresh" | "bold" | "elegant",
     trace:    true to play the outline animation,
     urlEl:    element that shows the address bar text,
     pages:    ["About us", "Menu", ...]   (optional, nav + footer),
     features: ["booking", "gallery", ...] (optional, preview blocks),
     primary:  "#hex"                      (optional brand colour)
   })
   ========================================================= */
window.TS = window.TS || {};

(function () {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- colour helpers ---------- */
  const hexToRgb = hex => { const n = parseInt(hex.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgbToHex = rgb => "#" + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v, i) => v + (y[i] - v) * t)); };
  function luminance(hex) {
    const ch = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }
  const textOn = hex => (luminance(hex) > 0.42 ? "#111111" : "#FFFFFF");
  const isLight = hex => luminance(hex) > 0.6;

  /** Applies a visitor-chosen brand colour to a business palette. */
  function withPrimary(colors, primary, style) {
    if (!primary) return colors;
    return {
      primary,
      accent: style === "bold" ? primary : colors.accent,
      soft: mix(primary, "#FFFFFF", 0.9),
      dark: style === "bold" ? mix(primary, "#0B0B0F", 0.88) : colors.dark
    };
  }

  /** Turns brand colours + style into the CSS variables a preview uses. */
  function palette(colors, style) {
    const { primary, accent, soft, dark } = colors;
    if (style === "bold") {
      return {
        bg: dark, surface: "rgba(255,255,255,0.06)", ink: "#FFFFFF", muted: "rgba(255,255,255,0.62)",
        soft: "rgba(255,255,255,0.07)", line: "rgba(255,255,255,0.12)",
        primary: accent, onPrimary: textOn(accent), accentText: accent, primaryText: accent,
        artBg: "rgba(255,255,255,0.05)", cloud: "rgba(255,255,255,0.35)", dark: true
      };
    }
    if (style === "elegant") {
      return {
        bg: "#FBF7F0", surface: "#FFFFFF", ink: dark, muted: "#6E665C",
        soft: "#F1E9DC", line: "rgba(40,30,20,0.09)",
        primary: dark, onPrimary: "#FFFFFF", accentText: isLight(primary) ? dark : primary, primaryText: isLight(primary) ? dark : primary,
        artBg: "#FFFFFF", cloud: "#F1E9DC"
      };
    }
    const softBg = isLight(soft) ? soft : "#F4F6F8";
    const safePrimary = isLight(primary) ? dark : primary;
    return {
      bg: "#FFFFFF", surface: "#FFFFFF", ink: isLight(dark) ? "#1A1A1A" : dark, muted: "#5F6B78",
      soft: softBg, line: "rgba(15,30,50,0.09)",
      primary: safePrimary, onPrimary: textOn(safePrimary), accentText: isLight(accent) ? safePrimary : accent, primaryText: safePrimary,
      artBg: "#FFFFFF", cloud: softBg
    };
  }

  function artSVG(p, iconKey) {
    const d = TS.icons[iconKey] || TS.icons.star;
    return `<svg viewBox="0 0 240 170" aria-hidden="true">
      <rect width="240" height="170" fill="${p.artBg}"/>
      <circle cx="192" cy="42" r="18" fill="${p.accentText === p.ink ? p.primary : p.accentText}" opacity="0.9"/>
      <rect x="120" y="30" width="34" height="10" rx="5" fill="${p.cloud}"/>
      <rect x="130" y="24" width="18" height="12" rx="6" fill="${p.cloud}"/>
      <path d="M0 170V118c40-26 72-30 112-8s64-12 128-20v80z" fill="${p.primaryText}" opacity="0.28"/>
      <path d="M0 170v-28c50-22 90-14 130-2s70-14 110-16v46z" fill="${p.primaryText}" opacity="0.7"/>
      <circle cx="78" cy="72" r="30" fill="${p.dark ? "rgba(255,255,255,0.1)" : "#FFFFFF"}" stroke="${p.primaryText}" stroke-opacity="0.25" stroke-width="1.5"/>
      <g transform="translate(60 54) scale(1.5)" fill="none" stroke="${p.primaryText}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></g>
    </svg>`;
  }

  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const bars = n => Array.from({ length: n }, () => "<i></i>").join("");

  const BOOKING_LABEL = {
    restaurant: ["Reserve a table", ["Date", "Time", "Guests"]],

        <div class="pv-cards3">${names.map(n => `<div class="pv-review"><span class="pv-stars">★★★★★</span>${bars(2)}<small>${n}</small></div>`).join("")}</div></div>`);
    }
    if (has("enquiry")) {
      out.push(`<div class="pv-block pv-enq" data-t><div><b class="pv-h">Get a quote</b><p>We reply within one working day.</p></div>
        <div class="pv-form"><span class="pv-field"><small>Name</small><i></i></span><span class="pv-field"><small>Phone</small><i></i></span><span class="pv-field pv-field--tall"><small>Message</small><i></i></span><span class="pv-btn pv-btn--sm">Send enquiry</span></div></div>`);
    }
    if (has("blog")) {
      out.push(`<div class="pv-block" data-t><b class="pv-h">Latest news</b><div class="pv-cards2">${[0, 1].map(i => `<div class="pv-post"><span class="pv-ph" style="--i:${i + 2}"></span><b>${["Our new season is here", "5 tips from our team"][i]}</b>${bars(1)}</div>`).join("")}</div></div>`);
    }
    if (has("map")) {
      out.push(`<div class="pv-block pv-mapblock" data-t><div class="pv-map"><span class="pv-pin">${TS.icon("pin")}</span></div>
        <div class="pv-hours"><b class="pv-h">Visit us</b><span><small>Mon–Fri</small><small>9:00 – 18:00</small></span><span><small>Sat</small><small>9:00 – 14:00</small></span><span class="pv-dir">Get directions →</span></div></div>`);
    }
    if (has("newsletter")) {
      out.push(`<div class="pv-block pv-news" data-t><b class="pv-h">Get our offers first</b><span class="pv-input"><i></i></span><span class="pv-btn pv-btn--sm">Subscribe</span></div>`);
    }
    return out.join("");
  }

  function markup(cfg, style, p, opts) {
    const vars = [
      ["bg", p.bg], ["surface", p.surface], ["ink", p.ink], ["muted", p.muted], ["soft", p.soft],
      ["line", p.line], ["primary", p.primary], ["on-primary", p.onPrimary],
      ["accent-text", p.accentText], ["primary-text", p.primaryText]
    ].map(([k, v]) => `--pv-${k}:${v}`).join(";");

    const feats = opts.features || [];
    const navPages = opts.pages ? opts.pages.filter(x => x !== "Home" && x !== "Contact").slice(0, 4) : cfg.links;
    const links = navPages.map(l => `<b>${esc(l)}</b>`).join("");
    const lang = feats.includes("languages") ? `<span class="pv-lang">EN · ES · FR</span>` : "";
    const cards = cfg.cards.map(([ic, t]) =>
      `<div class="pv-card" data-t><span class="pv-ic">${TS.icon(ic)}</span><b>${esc(t)}</b><i></i><i></i></div>`
    ).join("");
    const footer = opts.pages
      ? `<div class="pv-foot" data-t><span class="pv-logo pv-name"><i></i>${esc(cfg.name)}</span><span class="pv-foot-links">${opts.pages.map(x => `<small>${esc(x)}</small>`).join("")}</span></div>`
      : `<div class="pv-strip" data-t><span class="pv-check">✓</span><b>${esc(cfg.proof)}</b><span class="bars"><i></i><i></i></span></div>`;

    return `<div class="pv pv--${style}" style="${vars}">
      <div class="pv-nav" data-t>
        <span class="pv-logo pv-name"><i></i>${esc(cfg.name)}</span>
        <span class="pv-links"><b>Home</b>${links}</span>
        ${lang}
        <span class="pv-cta">${esc(cfg.cta)}</span>
        <span class="pv-burger" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="pv-hero" data-t>
        <div class="pv-copy">
          <small>${esc(cfg.kicker)}</small>
          <h4>${esc(cfg.headline)}</h4>
          <p>${esc(cfg.sub)}</p>
          <span class="pv-btn">${esc(cfg.cta)} →</span>
        </div>
        <div class="pv-art">${artSVG(p, cfg.art)}</div>
      </div>
      <div class="pv-cards">${cards}</div>
      ${blocks(cfg, feats, p)}
      ${footer}
      ${feats.includes("whatsapp") ? `<span class="pv-wa" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg></span>` : ""}
    </div>`;
  }

  /** Draws coral outlines around each block, then fills the blocks in. */
  function trace(body) {
    if (reduceMotion) return;
    body.querySelectorAll(".trace-layer, .trace-pen").forEach(n => n.remove());
    const base = body.getBoundingClientRect();
    const blocksEls = [...body.querySelectorAll("[data-t]")];
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "trace-layer");
    svg.setAttribute("width", base.width);
    svg.setAttribute("height", body.scrollHeight);
    const pen = document.createElement("span");
    pen.className = "trace-pen";

    const points = blocksEls.map((el, i) => {
      const r = el.getBoundingClientRect();
      const x = r.left - base.left, y = r.top - base.top + body.scrollTop;
      const delay = (i * 0.11).toFixed(2) + "s";
      el.style.setProperty("--d", delay);
      const rect = document.createElementNS(ns, "rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y);
      rect.setAttribute("width", r.width); rect.setAttribute("height", r.height);
      rect.setAttribute("rx", 6); rect.setAttribute("pathLength", 1);
      rect.style.setProperty("--d", delay);
      svg.appendChild(rect);
      return { x, y };
    });

    body.append(svg, pen);
    body.classList.remove("is-tracing");
    void body.offsetWidth;
    body.classList.add("is-tracing");

    clearTimeout(body._penTimers);
    points.forEach((pt, i) => setTimeout(() => {
      pen.style.left = pt.x - 7 + "px";
      pen.style.top = pt.y - 7 + "px";
    }, i * 110));

    clearTimeout(body._traceTimer);
    body._traceTimer = setTimeout(() => {
      body.classList.remove("is-tracing");
      svg.remove(); pen.remove();
    }, blocksEls.length * 110 + 1900);
  }

  TS.renderPreview = function (body, cfg, opts = {}) {
    const style = opts.style || "fresh";
    const colors = withPrimary(cfg.colors, opts.primary, style);
    body.innerHTML = markup(cfg, style, palette(colors, style), opts);
    if (opts.urlEl) opts.urlEl.innerHTML = `<span class="lock">https://</span>${esc(cfg.domain)}`;
    if (opts.trace) requestAnimationFrame(() => trace(body));
  };
  TS.tracePreview = trace;
  TS.colorUtils = { mix, textOn, isLight };
})();

</script>

<script>
/* =========================================================
   Concept Builder
   Steps: business → website type → pages → features → style
          → questions → contact → summary
   All options come from data/builder-options.js and
   data/business-types.js.
   ========================================================= */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STORE_KEY = "ts-concept-v1";

  const STEPS = [
    { id: "business", label: "Business" },
    { id: "website", label: "Website" },
    { id: "pages", label: "Pages" },
    { id: "features", label: "Add-ons" },
    { id: "style", label: "Style" },
    { id: "questions", label: "Goals" },
    { id: "details", label: "Details" },
    { id: "summary", label: "Summary" }
  ];

  /* ---------- state ---------- */
  const fresh = () => ({
    step: 0, maxStep: 0,
    business: "", name: "", tagline: "",
    websiteType: "business",
    pages: ["home", "contact"],
    features: [...TS.recommendedFeatures.business],
    style: "fresh", color: "",
    answers: {},
    contact: { name: "", phone: "", email: "", location: "", preferred: "WhatsApp" },
    ref: "", submitted: false,
    deliver: "", sent: null,
    notes: {}
  });
  let state = fresh();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { state = Object.assign(fresh(), JSON.parse(raw)); return true; }
    } catch (e) { /* storage unavailable */ }
    return false;
  }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }, 250);
  }

  /* ---------- helpers ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
  }
  const biz = () => TS.getBusiness(state.business || "other");
  const pageLabel = id => (TS.pages.find(p => p.id === id) || {}).label || id;
  const feature = id => TS.features.find(f => f.id === id);
  const orderedPages = () => TS.pages.filter(p => state.pages.includes(p.id));
  const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "").slice(0, 24);
  const firstName = () => (state.contact.name || "").trim().split(/\s+/)[0] || "";
  function makeRef() {
    const d = new Date();
    const ymd = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
    return `TSC-${ymd}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
  }

  function estimate() {
    const score = state.features.reduce((a, id) => a + ((feature(id) || {}).weight || 0), 0) + Math.max(0, state.pages.length - 6);
    const pkg = TS.packages.find(p => score <= p.maxScore);
    return { ...pkg, score };
  }

  function questionsFor() {
    return { common: TS.questions.common, specific: TS.questions.byType[state.business || "other"] || [] };
  }

  /* ---------- live preview ---------- */
  let device = "desktop";
  function previewConfig() {
    const b = biz();
    const name = state.name.trim() || b.name;
    return {
      ...b,
      name,
      headline: state.tagline.trim() || b.headline,
      domain: (slug(name) || "yourbusiness") + ".com",
      cta: state.websiteType === "store" ? "Shop now" : b.cta
    };
  }
  function renderPreview(trace) {
    const cfg = previewConfig();
    const blocks = state.features.map(id => (feature(id) || {}).block).filter(Boolean);
    TS.renderPreview($("#pvBody"), cfg, {
      style: state.style, trace: trace && !reduceMotion, urlEl: $("#pvUrl"),
      pages: orderedPages().map(p => p.label), features: blocks, primary: state.color || null
    });
    $("#stageTitle").textContent = (view === "plan" ? "Build plan" : "Live preview") + (state.business ? ` · ${cfg.name}` : "");
    renderPlan();
  }


  /* ---------- build plan (A: tree during steps, C: build line on summary) ----------
     group = branch in the tree, stage = where it sits on the build line
     (0 Brief, 1 Design, 2 Build, 3 Connect, 4 Launch). */
  const PLAN_MAP = {
    whatsapp: ["Connect", 3], booking: ["Sell", 2], store: ["Sell", 2], payments: ["Sell", 2],
    gallery: ["Content", 1], reviews: ["Connect", 3], map: ["Connect", 3], forms: ["Connect", 3],
    languages: ["Content", 1], blog: ["Content", 2], newsletter: ["Connect", 3], seo: ["Grow", 4],
    cms: ["Content", 2], analytics: ["Grow", 4]
  };
  const PLAN_GROUPS = ["Sell", "Connect", "Content", "Grow"];
  let view = "plan", planSig = "", planPrev = null, planFresh = null;
  const planGroup = id => (PLAN_MAP[id] || ["Connect", 3])[0];
  const planStage = id => (PLAN_MAP[id] || ["Connect", 3])[1];
  const boxW = t => Math.max(80, t.length * 7.4 + 26);
  const sign = v => v < 0 ? -1 : 1;
  /* Tree that grows one branch per step. Branches for steps not reached yet show as dashed placeholders.
     Only nodes that weren't on screen before animate in, so the tree visibly grows. */
  let planSeen = new Set(), planNewCount = 0;
  function fx(key, kind) {
    if (planSeen.has(key) || reduceMotion) { planSeen.next.add(key); return { cls: "", st: "" }; }
    planSeen.next.add(key);
    const d = (planNewCount++ * 0.05).toFixed(2);
    return { cls: kind, st: `animation-delay:${d}s` };
  }
  function planNode(x, y, label, cls, key) {
    const w = boxW(label), a = fx(key, "pop");
    const dot = cls === "new" ? "var(--coral)" : cls === "addon" ? "var(--green-bright)" : cls === "pending" ? "transparent" : "rgba(233,243,239,.55)";
    return `<g class="${a.cls}" style="${a.st}"><rect class="node-box ${cls}" x="${x}" y="${y - 13}" width="${w}" height="26" rx="13"/><circle cx="${x + 13}" cy="${y}" r="3" fill="${dot}"/><text class="t-node${cls === "pending" ? " t-pending" : ""}" x="${x + 23}" y="${y + 4}">${esc(label)}</text></g>`;
  }
  const clipL = (t, n = 26) => t.length > n ? t.slice(0, n - 1) + "…" : t;
  const capList = (arr, n) => arr.length > n ? [...arr.slice(0, n - 1), { l: `+${arr.length - n + 1} more`, c: "" }] : arr;
  function planGroupsData() {
    const reached = i => i <= state.maxStep;
    const b = state.business ? biz() : null;
    const w = TS.websiteTypes.find(x => x.id === state.websiteType);
    const st = TS.visualStyles.find(x => x.id === state.style);
    const ans = briefAnswers().flatMap(a => Array.isArray(a.answer) ? a.answer : [a.answer]).map(v => ({ l: clipL(String(v)), c: "" }));
    const c = state.contact;
    const groups = [
      { key: "business", name: "Business", items: b ? [{ l: b.label, c: "" }, ...(state.name.trim() ? [{ l: clipL(state.name.trim()), c: "" }] : [])] : [] , empty: "Pick your business" },
      { key: "website", name: "Website", items: w ? [{ l: w.label, c: "" }] : [], empty: "Choose a website type" },
      { key: "pages", name: "Pages", items: capList(orderedPages().map(p => ({ l: p.label, c: "" })), 4), empty: "Choose pages" },
      { key: "features", name: "Add-ons", items: capList(state.features.filter(feature).map(id => ({ l: clipL(feature(id).label), c: id === planFresh ? "new" : "addon" })), 4), empty: "No add-ons yet" },
      { key: "style", name: "Style", items: [{ l: st ? st.label : "Style", c: "" }, { l: state.color ? `Colour ${state.color.toUpperCase()}` : "Suggested colour", c: "", swatch: state.color || (b ? b.colors.primary : "") }], empty: "Pick a look" },
      { key: "questions", name: "Goals", items: capList(ans, 3), empty: "A few questions" },
      { key: "details", name: "Details", items: c.name.trim() ? [{ l: clipL(c.name.trim()), c: "" }, { l: `Reply by ${c.preferred}`, c: "" }] : [], empty: "Your contact details" }
    ];
    return groups.map((g, i) => {
      const pending = !reached(i);
      const items = pending ? [] : g.items.length ? g.items : [{ l: g.empty, c: "pending" }];
      return { ...g, i, pending, current: i === state.step, items };
    });
  }
  function planTree() {
    planSeen.next = new Set(); planNewCount = 0;
    const row = 34; let y = 30; const br = [];
    planGroupsData().forEach(g => {
      if (!g.items.length) { br.push({ ...g, ys: [], cy: y + 8 }); y += 40; return; }
      const ys = g.items.map(() => { const v = y; y += row; return v; }); y += 14; br.push({ ...g, ys, cy: (ys[0] + ys[ys.length - 1]) / 2 });
    });
    const compact = window.innerWidth < 600;
    const H = y + 6, rootY = H / 2, rx = 16, trunk = 168, gw = 120, bx = compact ? 14 : 186, lx = compact ? 168 : 340;
    const widest = Math.max(80, ...br.flatMap(b => b.items.map(i => boxW(i.l))));
    let s = `<svg viewBox="0 0 ${Math.max(compact ? 360 : 600, lx + widest + 12)} ${H}" role="img" aria-label="Your website plan so far, step by step">`;
    if (compact) s += `<line x1="5" y1="${br[0].cy}" x2="5" y2="${br[br.length - 1].cy}" stroke="var(--green-bright)" stroke-opacity=".5" stroke-width="1.4"/>`;
    br.forEach(b => {
      const state_ = b.pending ? "p" : "a";
      const dir = sign(b.cy - rootY), flat = Math.abs(b.cy - rootY) < 1;
      const aw = fx(`w:${b.key}:${state_}`, "draw");
      s += compact
        ? `<path class="wire ${b.pending ? "pending" : "on"} ${aw.cls}" pathLength="1" style="${aw.st}" d="M5 ${b.cy} H${bx}"/>`
        : `<path class="wire ${b.pending ? "pending" : "on"} ${aw.cls}" pathLength="1" style="${aw.st}" d="M${rx + 136} ${rootY} H${trunk - 8} ${flat ? "" : `Q${trunk} ${rootY} ${trunk} ${rootY + dir * 8} V${b.cy - dir * 8} Q${trunk} ${b.cy} ${trunk + 8} ${b.cy}`} H${bx}"/>`;
      b.ys.forEach((ly, j) => {
        const it = b.items[j], d2 = sign(ly - b.cy), same = Math.abs(ly - b.cy) < 1;
        const k = `${b.key}:${it.l}:${it.c}`, lw = fx(`lw:${k}`, "draw");
        s += `<path class="wire ${it.c === "pending" ? "pending" : "on"} ${lw.cls}" pathLength="1" style="${lw.st}" d="M${bx + gw} ${b.cy} H${lx - 30} ${same ? "" : `Q${lx - 22} ${b.cy} ${lx - 22} ${b.cy + d2 * 8} V${ly - d2 * 8} Q${lx - 22} ${ly} ${lx - 14} ${ly}`} H${lx}"/>`;
        s += planNode(lx, ly, it.l, it.c, `n:${k}`);
        if (it.swatch) s += `<circle cx="${lx + boxW(it.l) + 12}" cy="${ly}" r="6" fill="${esc(it.swatch)}" stroke="rgba(233,243,239,.4)"/>`;
      });
      const ga = fx(`g:${b.key}:${state_}:${b.current}`, "pop");
      const stroke = b.current ? "var(--coral)" : b.pending ? "rgba(233,243,239,.25)" : "#9FE3BC";
      s += `<g class="plan-jump ${ga.cls}" style="${ga.st}" data-goto="${b.i}" role="button" tabindex="0" aria-label="Go to ${esc(b.name)}" ${b.current ? 'data-current="1"' : ""}><rect x="${bx}" y="${b.cy - 14}" width="${gw}" height="28" rx="6" fill="${b.current ? "rgba(251,114,80,.1)" : "none"}" stroke="${stroke}" stroke-opacity="${b.current ? 1 : .55}" ${b.pending ? 'stroke-dasharray="3 4"' : ""}/><text class="t-group" x="${bx + 12}" y="${b.cy + 4}" style="${b.pending ? "fill:rgba(233,243,239,.4)" : b.current ? "fill:var(--coral)" : ""}">${b.name.toUpperCase()}</text><text class="t-soft" x="${bx + gw - 10}" y="${b.cy + 4}" text-anchor="end" style="${b.current ? "fill:var(--coral)" : ""}">${b.current ? "now" : String(b.i + 1).padStart(2, "0")}</text></g>`;
    });
    const nm = state.business ? previewConfig().name : "your website";
    const ra = fx("root", "pop");
    if (!compact) s += `<g class="${ra.cls}" style="${ra.st}"><rect x="${rx}" y="${rootY - 22}" width="136" height="44" rx="22" fill="var(--green-bright)"/><text class="t-root" x="${rx + 68}" y="${rootY - 1}" text-anchor="middle">YOUR SITE</text><text x="${rx + 68}" y="${rootY + 13}" text-anchor="middle" style="fill:var(--navy);font-size:10px;opacity:.75">${esc(nm.length > 18 ? nm.slice(0, 17) + "…" : nm).toLowerCase()}</text></g>`;
    planSeen = planSeen.next;
    return s + "</svg>";
  }
  const PLAN_SHORT = { whatsapp: "WhatsApp", booking: "Booking", store: "Online store", payments: "Card pay", gallery: "Gallery",
    reviews: "Reviews", map: "Map + hours", forms: "Enquiry form", languages: "3 languages", blog: "Blog", newsletter: "Newsletter",
    seo: "Google SEO", cms: "Self-edit", analytics: "Analytics" };
  const clip = (t, n = 12) => t.length > n ? t.slice(0, n - 1) + "…" : t;
  function planChip(x, y, label, cls, delay) {
    const w = 106, dot = cls === "new" ? "var(--coral)" : cls === "addon" ? "var(--green-bright)" : "rgba(233,243,239,.55)";
    return `<g class="pop" style="animation-delay:${delay}s"><rect class="node-box ${cls}" x="${x - w / 2}" y="${y - 12}" width="${w}" height="24" rx="12"/><circle cx="${x - w / 2 + 11}" cy="${y}" r="2.6" fill="${dot}"/><text class="t-node" x="${x - w / 2 + 19}" y="${y + 4}" style="font-size:11px">${esc(label)}</text></g>`;
  }
  function planLine() {
    const est = estimate(), pages = orderedPages().map(p => p.label);
    const stages = [
      { n: "Brief", sub: "kick-off", items: ["Brief call", "Domain"] },

    return [...specific, ...common]
      .map(q => ({ id: q.id, question: q.label, answer: state.answers[q.id] }))
      .filter(a => a.answer && (!Array.isArray(a.answer) || a.answer.length) && String(a.answer).trim());
  }

  /** Structured client brief: the same shape is saved by api/brief.php. */
  function buildBrief() {
    const b = biz(), est = estimate();
    return {
      ref: state.ref || (state.ref = makeRef()),
      created_at: new Date().toISOString(),
      source: "concept_builder",
      business: { type: b.id, type_label: b.label, name: state.name.trim(), tagline: state.tagline.trim() },
      website: {
        type: state.websiteType, type_label: TS.websiteTypes.find(x => x.id === state.websiteType).label,
        style: state.style, style_label: TS.visualStyles.find(x => x.id === state.style).label,
        brand_color: state.color || b.colors.primary,
        pages: orderedPages().map(p => p.label),
        features: state.features.map(id => feature(id).label)
      },
      addons: state.features.filter(feature).map(id => ({ label: feature(id).label, desc: feature(id).desc })),
      plan: { weeks: est.weeks, stages: planStages() },
      delivery: currentDeliver(),
      answers: briefAnswers().map(a => ({ question: a.question, answer: a.answer })),
      notes: stepNotes().map(nt => ({ step: nt.step, text: nt.text })),
      contact: { ...state.contact },
      estimate: { package: est.label, timeline: est.weeks, score: est.score }
    };
  }

  function briefText(br) {
    br = br || buildBrief();
    const biz = br.business || {}, web = br.website || {}, est = br.estimate || {}, c = br.contact || {};
    const answers = Array.isArray(br.answers) ? br.answers : [];
    const notes = Array.isArray(br.notes) ? br.notes : [];
    const lines = [
      `Website concept ${br.ref || ""}`,
      ``,
      `Business: ${biz.name || "(not given)"} (${biz.type_label || ""})`,
      biz.tagline ? `Tagline: ${biz.tagline}` : "",
      `Website: ${web.type_label || ""} · ${web.style_label || ""} · ${web.brand_color || ""}`,
      `Pages: ${(web.pages || []).join(", ")}`,
      `Features: ${(web.features || []).join(", ") || "none"}`,
      ...answers.map(a => `${a.question} ${Array.isArray(a.answer) ? a.answer.join(", ") : a.answer}`),
      `Suggested package: ${est.package || ""} (${est.timeline || ""})`,
      ``,
      `Contact: ${c.name || ""}${c.phone ? " · " + c.phone : ""}${c.email ? " · " + c.email : ""}${c.location ? " · " + c.location : ""}`,
      `Prefers: ${c.preferred || ""}`,
      ...(notes.length ? [``, `More details:`, ...notes.map(nt => `- ${nt.step}: ${nt.text}`)] : [])
    ];
    return lines.filter((l, i) => l !== "" || lines[i - 1] !== "").join("\n");
  }

  function waLink(pdfUrl, full) {
    const text = full
      ? `Hi Trace Solutions Global! I built a website concept on your site.\n\n${briefText()}${pdfUrl ? `\n\nMy PDF plan: ${pdfUrl}` : ""}`
      : `Hi Trace Solutions Global! I'm looking at a website concept (ref ${state.ref || "new"}) and have a question.`;
    return `https://wa.me/${TS.site.whatsapp}?text=${encodeURIComponent(text)}`;
  }

  /** Email with the order pre-filled (mail apps can't take attachments from a link, so the PDF is attached by hand). */
  function mailLink() {
    const subject = `Website concept ${state.ref || ""}: ${state.name.trim() || state.contact.name.trim() || "new enquiry"}`;
    let body = `Hi Trace Solutions Global,\n\nHere is my website concept. I've attached my PDF plan.\n\n${briefText()}`;
    if (body.length > 1800) body = body.slice(0, 1800) + "…";
    return `mailto:${TS.site.salesEmail || TS.site.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }
  const telLink = () => `tel:+${String(TS.site.whatsapp).replace(/\D/g, "")}`;
  /** WhatsApp, email and call: the three ways to reach us from the last step. */
  const contactRow = pdfUrl => `<div class="reach">
      <a class="btn btn--wa btn--sm" href="${waLink(pdfUrl || "", true)}" target="_blank" rel="noopener">Send my order on WhatsApp</a>
      <a class="btn btn--outline btn--sm" href="${mailLink()}" data-mail-plan>Email us my PDF plan</a>
      <a class="btn btn--outline btn--sm" href="${telLink()}">Call ${esc(TS.site.phoneDisplay)}</a>
    </div>`;

  /* ---------- PDF plan: build, deliver, save ---------- */
  const cap = name => (window.claude && typeof window.claude.use === "function")
    ? Promise.resolve(window.claude.use(name)).catch(() => null)
    : Promise.resolve(null);
  /* The claude.ai preview has no PHP server: there the plan is saved to the
     owner's back office and offered as a download instead of emailed. */
  const previewMode = () => !/^https?:$/.test(location.protocol) || /claude|usercontent/.test(location.hostname);

  function planStages() {
    const pages = orderedPages().map(p => p.label);
    const st = TS.visualStyles.find(x => x.id === state.style);
    const stages = [
      { name: "Brief", sub: "Kick-off call", items: ["Goals and content", "Domain check"] },
      { name: "Design", sub: "Look and feel", items: [(st ? st.label : "Custom") + " design"] },
      { name: "Build", sub: `${pages.length} pages`, items: pages },
      { name: "Connect", sub: "Tools and add-ons", items: [] },
      { name: "Launch", sub: "Go live", items: ["Testing", "Go live and handover"] }
    ];
    state.features.filter(feature).forEach(id => stages[planStage(id)].items.push(feature(id).label));
    return stages;
  }

  function pdfFile(bytes, ref) {
    return new File([bytes], `Trace-website-plan-${ref}.pdf`, { type: "application/pdf" });
  }

  /** Hands the PDF to the share sheet (WhatsApp on phones). Returns false when sharing isn't available. */
  async function sharePdfFile(file, text) {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: file.name, text });
      return true;
    }
    return false;
  }

  /**
   * Email the concept to the Web3Forms access-key inbox (sales).
   * The free plan rejects file attachments, so the email carries a link that
   * opens admin.html and downloads the same PDF the customer got. With a
   * Web3Forms Pro key, set TS.site.web3formsAttachPdf to attach it as well.
   */
  async function submitConcept(brief, bytes) {
    const key = (TS.site.web3formsKey || "").trim();
    if (!key) throw new Error("Web3Forms is not connected.");
    const c = brief.contact || {};
    const customer = String(c.email || "").trim();
    const fd = new FormData();
    fd.append("access_key", key);
    fd.append("from_name", TS.site.name || "Trace Solutions Global");
    fd.append("subject", `Website concept ${brief.ref}: ${(brief.business && brief.business.name) || c.name || "new"}`);
    if (EMAIL_RE.test(customer)) { fd.append("email", customer); fd.append("replyto", customer); }
    fd.append("name", c.name || "");
    fd.append("phone", c.phone || "");
    const pdfLink = `https://${TS.site.website}/admin.html#pdf=${encodeURIComponent(brief.ref)}`;
    fd.append("message", `New website concept ${brief.ref}\n\nDownload the customer's PDF plan (sign in to the admin page): ${pdfLink}\n\n` + briefText(brief));
    if (TS.site.web3formsAttachPdf && bytes) fd.append("attachment", pdfFile(bytes, brief.ref));
    fd.append("botcheck", "");
    const res = await fetchWithTimeout("https://api.web3forms.com/submit", { method: "POST", body: fd, headers: { Accept: "application/json" } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) {
      throw new Error((data.body && data.body.message) || data.message || "We couldn't send your plan just now. Please try again, or message us on WhatsApp.");
    }
    return data;
  }

  async function savePdf(bytes, filename) {
    const blob = new Blob([bytes], { type: "application/pdf" });
    const dl = await cap("downloads");
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast("PDF saved"); }
      catch (e) { if (e && e.code !== "declined") toast("The PDF couldn't be saved here."); }
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function downloadPlan() {
    const br = buildBrief();
    savePdf(TS.pdf.plan(br, TS.site), `Trace-website-plan-${br.ref}.pdf`);
  }

  async function saveToBackOffice(brief) {
    try {
      const [db, user] = await Promise.all([cap("db"), cap("user")]);
      if (!db || !user) return false;
      const uid = await user.id();
      if (!uid) return false;
      const ref = db.doc("concepts/" + uid);
      const entry = { ...brief, received_at: new Date().toISOString() };
      const body = { updated_at: entry.received_at, items: { [brief.ref]: entry } };
      try { await ref.update(body); } catch (e) { await ref.set(body); }
      return true;
    } catch (e) { return false; }
  }

  const ORDER_TASKS = ["Discovery call & brief", "Send proposal & quote", "Collect logo, photos & content", "Homepage design", "Inner pages", "Mobile & speed check", "Domain, hosting & email", "Client review & changes", "Go live", "Handover & training"];

  /** Adds the order to the projects dashboard (admin.html) as a new lead. */
  async function saveOrder(brief) {
    if (!window.TSDB || !TSDB.ready()) return false;
    const b = brief.business || {}, w = brief.website || {}, c = brief.contact || {};
    try {
      await TSDB.rest("rpc/submit_website_lead", {
        method: "POST",
        body: {
          payload: {
            name: `${b.name || c.name || "New"} website`, client: b.name || "", businessType: b.type_label || "",
            stage: "lead", priority: "normal",
            contactName: c.name || "", phone: c.phone || "", email: c.email || "",
            value: 0, paid: 0, startDate: new Date().toISOString().slice(0, 10), dueDate: "",
            domain: "", brandColor: w.brand_color || "#0D8B76", previewUrl: "", liveUrl: "",
            pages: (w.pages || []).join(", "), features: (w.features || []).join(", "),
            notes: briefText(brief), tasks: ORDER_TASKS.map(t => ({ t, done: false })),
            ref: brief.ref, brief
          }
        }
      });
      return true;
    } catch (e) { return false; }
  }

  function sendHint(text, step) {
    const msg = $("#sendMsg");
    msg.hidden = false;
    msg.innerHTML = esc(text) + (step !== undefined ? ` <button type="button" class="edit" data-goto="${step}" style="border:0;background:none;color:var(--green);font-weight:700;cursor:pointer;padding:0">Edit details</button>` : "");
  }

  async function sendPlan() {
    const btn = $("#sendPlan");
    $("#sendMsg").hidden = true;
    const via = currentDeliver(), c = state.contact;
    if (via === "email" && !EMAIL_RE.test(c.email.trim())) return sendHint("Add your email address to get your plan by email.", 6);
    if (via === "whatsapp" && phoneDigits(c.phone).length < 8) return sendHint("Add your WhatsApp number, with country code, to get your plan on WhatsApp.", 6);
    const label = btn.innerHTML;
    btn.disabled = true; btn.textContent = "Preparing your PDF…";
    const brief = buildBrief();
    let bytes;
    try { bytes = TS.pdf.plan(brief, TS.site); }
    catch (e) { btn.disabled = false; btn.innerHTML = label; return sendHint("We couldn't create your PDF just now. Please try again."); }
    const file = pdfFile(bytes, brief.ref);
    const result = { via, mode: "preview", pdfUrl: "", emailed: false, whatsappSent: false };
    let web3ok = false;
    if ((TS.site.web3formsKey || "").trim()) {
      btn.textContent = via === "email" ? "Emailing your plan…" : "Sending your plan…";
      try {
        await submitConcept(brief, bytes);
        web3ok = true;
        result.mode = "web3forms";
        if (via === "email") savePdf(bytes, file.name);
      } catch (e) {
        result.web3Error = e.message;
      }
    }
    if (await saveOrder(brief) && !web3ok) {
      web3ok = true;
      result.mode = "web3forms";
      if (via === "email") savePdf(bytes, file.name);
    }
    if (previewMode()) {
      await saveToBackOffice(brief);
      if (via === "email" && !web3ok) {
        btn.disabled = false; btn.innerHTML = label;
        return sendHint(result.web3Error || "This is a preview, so the email can't be sent yet. Download your PDF instead, or message us on WhatsApp.");
      }
    } else if (!web3ok) {
      try {
        btn.textContent = "Saving your plan…";
        const res = await fetchWithTimeout("api/brief.php", {
          method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ ...brief, pdf_base64: TS.pdf.toBase64(bytes), skip_mail: web3ok })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || "We couldn't send your plan just now. Please try again, or message us on WhatsApp.");
        Object.assign(result, {
          mode: web3ok ? "web3forms" : "server",
          pdfUrl: data.pdf_url || "",
          emailed: web3ok ? via === "email" : !!data.emailed,
          whatsappSent: !!data.whatsapp_sent
        });
      } catch (e) {
        if (via === "email" && !result.emailed) {
          btn.disabled = false; btn.innerHTML = label;
          return sendHint(result.web3Error || e.message);
        }
      }
    }
    if (via === "whatsapp" && !result.whatsappSent) {
      btn.textContent = "Opening WhatsApp…";
      let shared = false;
      try { shared = await sharePdfFile(file, `Website concept ${brief.ref} from Trace Solutions Global`); }
      catch (e) {
        if (e && e.name === "AbortError") {
          btn.disabled = false; btn.innerHTML = label;
          return sendHint("WhatsApp was closed before the PDF went through. Tap the button to try again.");
        }
      }
      result.whatsappSent = shared;
      if (!shared) savePdf(bytes, file.name);
    }
    state.sent = result; state.submitted = true; save(); show(state.step);
    if (via === "download") savePdf(bytes, file.name);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) { toast(text); }
  }

  async function copyBrief() {
    const text = briefText();
    try { await navigator.clipboard.writeText(text); toast("Brief copied"); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Brief copied"); } catch (_) { toast("Select and copy the brief manually"); }
      ta.remove();
    }
  }

  /* ---------- navigation ---------- */
  function validate(step) {
    const id = STEPS[step].id;
    const hint = $("#stepHint");
    if (id === "business" && !state.business) {
      if (hint) { hint.hidden = false; hint.textContent = "Choose a business type to continue."; }
      return false;
    }
    if (id === "details") {
      const c = state.contact;
      let msg = "";
      if (!c.name.trim()) msg = "Please add your name.";
      else if (!c.phone.trim() && !c.email.trim()) msg = "Add a phone number or an email so we can send your proposal.";
      else if (c.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) msg = "That email address doesn't look right.";
      if (msg) { hint.hidden = false; hint.textContent = msg; return false; }
    }
    return true;
  }

  function show(step, opts = {}) {
    state.step = Math.max(0, Math.min(STEPS.length - 1, step));
    state.maxStep = Math.max(state.maxStep, state.step);
    const host = $("#stepHost");
    host.innerHTML = `<div class="b-anim">${views[STEPS[state.step].id]()}${notesBox(STEPS[state.step].id)}</div>`;
    renderProgress();
    const last = state.step === STEPS.length - 1;
    $("#stepNav").hidden = last;
    $("#backBtn").hidden = state.step === 0;
    if (last && opts.fromLoad !== true) setView("plan"); else renderPlan();
    $("#stepCount").textContent = last ? "" : `Step ${state.step + 1} of ${STEPS.length - 1}`;
    $("#nextBtn").innerHTML = state.step === STEPS.length - 2 ? `See my concept <span class="arrow">→</span>` : `Next <span class="arrow">→</span>`;
    if (opts.scroll !== false && window.innerWidth <= 980) {
      $(".b-panel").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    } else if (opts.scroll !== false) {
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    }
    save();
  }

  /* ---------- events ---------- */
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const goto = e.target.closest && e.target.closest(".plan-jump[data-goto]");
    if (!goto) return;
    e.preventDefault();
    const i = +goto.dataset.goto;
    if (i !== state.step) show(i);
  });

  document.addEventListener("click", e => {
    const t = e.target;
    const goto = t.closest("[data-goto]");
    if (goto && !goto.disabled) {
      const i = +goto.dataset.goto;
      if (i !== state.step) show(i);
      return;
    }

    const bz = t.closest("[data-business]");
    if (bz) {
      const changed = state.business !== bz.dataset.business;
      state.business = bz.dataset.business;
      if (changed) {
        state.pages = ["home", ...(TS.recommendedPages[state.business] || []), "contact"];
        if (state.websiteType === "store" && !state.pages.includes("shop")) state.pages.splice(1, 0, "shop");
        state.color = "";
      }
      $$("[data-business]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.business === state.business)));
      const h = $("#stepHint"); if (h) h.hidden = true;
      renderPreview(changed); save(); return;
    }
    const wt = t.closest("[data-wtype]");
    if (wt) {
      const changed = state.websiteType !== wt.dataset.wtype;
      state.websiteType = wt.dataset.wtype;
      if (changed) {
        state.features = [...(TS.recommendedFeatures[state.websiteType] || [])];
        if (state.websiteType === "store" && !state.pages.includes("shop")) state.pages.splice(1, 0, "shop");
        toast("Suggested features updated for a " + TS.websiteTypes.find(x => x.id === state.websiteType).label.toLowerCase());
      }
      $$("[data-wtype]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.wtype === state.websiteType)));
      renderPreview(changed); save(); return;
    }
    const st = t.closest("[data-style]");
    if (st) {
      state.style = st.dataset.style;
      $$("[data-style]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.style === state.style)));
      renderPreview(true); save(); return;
    }
    const col = t.closest("[data-color]");
    if (col) { setColor(col.dataset.color, true); return; }

    const qb = t.closest("[data-q][data-qtype]");
    if (qb && qb.tagName === "BUTTON") {
      const id = qb.dataset.q, v = qb.dataset.value;
      if (qb.dataset.qtype === "multi") {
        const cur = Array.isArray(state.answers[id]) ? state.answers[id] : [];
        state.answers[id] = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
        qb.setAttribute("aria-pressed", String(state.answers[id].includes(v)));
      } else {
        state.answers[id] = state.answers[id] === v ? "" : v;
        $$(`[data-q="${id}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.value === state.answers[id])));
      }
      renderPlan(); save(); return;
    }
    const pref = t.closest("[data-preferred]");
    if (pref) {
      state.contact.preferred = pref.dataset.preferred;
      $$("[data-preferred]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.preferred === state.contact.preferred)));
      renderPlan(); save(); return;
    }
    if (t.closest("#sendPlan")) { sendPlan(); return; }
    const dlv = t.closest("[data-deliver]");
    if (dlv) {
      state.deliver = dlv.dataset.deliver; save();
      $$("[data-deliver]").forEach(x => x.setAttribute("aria-pressed", String(x === dlv)));
      const sb = $("#sendPlan"); if (sb) sb.innerHTML = `${SEND_LABEL[state.deliver]} <span class="arrow">→</span>`;
      const note = $("#deliverNote"); if (note) note.textContent = `${deliverNote(state.deliver)} Your fixed-price proposal follows within 24 hours.`;
      $("#sendMsg").hidden = true;
      return;
    }
    if (t.closest("[data-dl-pdf]")) { downloadPlan(); return; }
    const cp = t.closest("[data-copy]");
    if (cp) { copyText(cp.dataset.copy); return; }
    if (t.closest("#copyBrief")) { copyBrief(); return; }
    if (t.closest("[data-mail-plan]") && !state.sent) downloadPlan();   /* so the PDF is ready to attach */
    if (t.closest("[data-restart]")) {
      state = fresh(); save(); show(0); renderPreview(true); return;
    }
    const vw = t.closest("[data-view]");
    if (vw) {
      setView(vw.dataset.view);
      if (vw.classList.contains("view-plan") && window.innerWidth <= 980) $(".b-stage").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      return;
    }
    const dv = t.closest("[data-device]");
    if (dv) {
      device = dv.dataset.device;
      $$("[data-device]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.device === device)));
      $("#stageFrame").classList.toggle("is-mobile", device === "mobile");
      setTimeout(() => renderPreview(false), 460);
      return;
    }
  });

  function setColor(c, trace) {
    state.color = c;
    $$("[data-color]").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.color || "").toLowerCase() === c.toLowerCase())));
    const n = $("#colorName"); if (n) n.textContent = c ? c.toUpperCase() : "Suggested";
    renderPreview(trace); save();
  }

  let typingTimer, planTimer;
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.bind) {
      state[t.dataset.bind] = t.value;
      clearTimeout(typingTimer); typingTimer = setTimeout(() => renderPreview(false), 120);
      save();
    }
    if (t.dataset.contact) { state.contact[t.dataset.contact] = t.value; const h = $("#stepHint"); if (h) h.hidden = true; clearTimeout(planTimer); planTimer = setTimeout(renderPlan, 350); save(); }
    if (t.dataset.note) { state.notes = { ...(state.notes || {}), [t.dataset.note]: t.value }; save(); }
    if (t.dataset.q && t.dataset.qtype === "text") { state.answers[t.dataset.q] = t.value; clearTimeout(planTimer); planTimer = setTimeout(renderPlan, 350); save(); }
    if (t.id === "customColor") {
      clearTimeout(typingTimer);
      const v = t.value; typingTimer = setTimeout(() => setColor(v, false), 60);
    }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.page) {
      const id = t.dataset.page;
      state.pages = t.checked ? [...new Set([...state.pages, id])] : state.pages.filter(x => x !== id);
      $("#pageCount").textContent = `${state.pages.length} selected`;
      renderPreview(false); save();
    }
    if (t.dataset.feature) {
      const id = t.dataset.feature;
      state.features = t.checked ? [...new Set([...state.features, id])] : state.features.filter(x => x !== id);
      $("#featCount").textContent = `${state.features.length} selected`;
      renderPreview(false); save();
      if (t.checked) {
        const block = $(`#pvBody .pv-${({ booking: "book", store: "cart" })[id] || ""}`);
        if (block) block.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
      }
    }
  });

  $("#nextBtn").addEventListener("click", () => { if (validate(state.step)) show(state.step + 1); });
  $("#backBtn").addEventListener("click", () => show(state.step - 1));

  /* ---------- header bits ---------- */
  function initHeader() {
    const header = $("#siteHeader"), toggle = $("#menuToggle");
    const onScroll = () => header.classList.toggle("is-scrolled", window.scrollY > 8);
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
    const setOpen = open => {
      document.body.classList.toggle("menu-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    };
    toggle.addEventListener("click", () => setOpen(!document.body.classList.contains("menu-open")));
    $("#navLinks").addEventListener("click", e => { if (e.target.closest("a")) setOpen(false); });
    $$("[data-site]").forEach(el => { el.textContent = TS.site[el.dataset.site] || ""; });
    const y = $("#year"); if (y) y.textContent = new Date().getFullYear();
    $$('[data-site-link="whatsapp"]').forEach(a => {
      a.href = `https://wa.me/${TS.site.whatsapp}?text=${encodeURIComponent("Hi Trace Solutions Global, I have a question about a website.")}`;
    });
  }

  /* ---------- boot ---------- */
  initHeader();
  const params = new URLSearchParams(location.search);
  const restored = load();
  const qType = params.get("type"), qStyle = params.get("style");
  if (qType && TS.businessTypes.some(b => b.id === qType) && (!restored || !state.business)) {
    state.business = qType;
    state.pages = ["home", ...(TS.recommendedPages[qType] || []), "contact"];
  }
  if (qStyle && TS.visualStyles.some(s => s.id === qStyle)) state.style = qStyle;
  if (state.submitted && state.step !== STEPS.length - 1) state.submitted = false;
  setView(view);
  show(state.step, { scroll: false });
  renderPreview(true);
  if (restored && state.business) toast("Welcome back. We kept your concept.");
})();

</script>
</body>
</html>
